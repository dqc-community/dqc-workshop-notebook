[project]
name = "dqc-workshop"
version = "0.1.0"
description = "Distributed quantum computing workshop notebook"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "ipykernel",
    "marimo[mcp]",
    "pandas",
    "matplotlib",
    "graphviz",
    "qiskit>=1.0",
    "qiskit-aer",
    "qiskit-ibm-runtime",
    "bosonic-sdk[disqco,hypergraph]",
    "rich",
    "pyarrow>=24.0.0",
    "altair>=6.1.0",
]

[[tool.uv.index]]
name = "test-pypi"
url = "https://test.pypi.org/simple/"
default = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
default = true

[tool.uv.sources]
bosonic-sdk = { index = "test-pypi" }

[tool.uv]
index-strategy = "unsafe-best-match"

[dependency-groups]
dev = [
    "qiskit-docs-mcp-server>=0.2.0",
    "qiskit-mcp-server>=0.3.0",
]

[tool.marimo]
tags = ["workshop", "quantum-computing"]
